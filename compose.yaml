name: mediflow

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: medicaldelivery
      POSTGRES_USER: mediflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mediflow -d medicaldelivery"]
      interval: 5s
      timeout: 3s
      retries: 12
    volumes:
      - postgres:/var/lib/postgresql/data
    restart: unless-stopped

  api:
    image: mediflow-api:${MEDIFLOW_IMAGE_TAG:-local}
    build:
      context: .
      target: api
    environment:
      PORT: 5000
      DATABASE_URL: postgres://mediflow:${POSTGRES_PASSWORD}@db:5432/medicaldelivery
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      CLIENT_URLS: ${CLIENT_URLS:-http://localhost:8082,http://127.0.0.1:8082}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 6
    volumes:
      - uploads:/app/uploads
    restart: unless-stopped

  web:
    image: mediflow-web:${MEDIFLOW_IMAGE_TAG:-local}
    build:
      context: .
      target: web
    ports:
      - "${MEDIFLOW_BIND_IP:-127.0.0.1}:${MEDIFLOW_PORT:-8082}:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres:
  uploads:
