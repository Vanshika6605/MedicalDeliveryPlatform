---
- name: Deploy the MediFlow web tier
  hosts: mediflow_web
  become: true
  vars:
    mediflow_dist: "{{ playbook_dir }}/../../dist"
    mediflow_web_root: /var/www/mediflow
    mediflow_url: "http://127.0.0.1:{{ mediflow_port }}"

  tasks:
    - name: Check that the frontend was built on the control node
      ansible.builtin.stat:
        path: "{{ mediflow_dist }}/index.html"
      delegate_to: localhost
      become: false
      register: mediflow_build

    - name: Require a frontend build before provisioning
      ansible.builtin.assert:
        that: mediflow_build.stat.isreg | default(false)
        fail_msg: "Run npm run build from the repository root before deploying."

    - name: Install Nginx without starting the distribution default site
      ansible.builtin.apt:
        name: nginx
        state: present
        update_cache: true
        cache_valid_time: 3600
        policy_rc_d: 101

    - name: Create the document root
      ansible.builtin.file:
        path: "{{ mediflow_web_root }}"
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Copy the compiled MediFlow UI
      ansible.builtin.copy:
        src: "{{ mediflow_dist }}/"
        dest: "{{ mediflow_web_root }}/"
        owner: root
        group: root
        mode: "0644"
        directory_mode: "0755"

    - name: Validate and install the MediFlow Nginx configuration
      ansible.builtin.template:
        src: nginx.conf.j2
        dest: /etc/nginx/mediflow.conf
        owner: root
        group: root
        mode: "0644"
        validate: /usr/sbin/nginx -t -c %s
      notify: Restart MediFlow web service

    - name: Install the MediFlow systemd unit
      ansible.builtin.copy:
        src: mediflow-web.service
        dest: /etc/systemd/system/mediflow-web.service
        owner: root
        group: root
        mode: "0644"
      notify: Restart MediFlow web service

    - name: Apply pending configuration changes before checking HTTP
      ansible.builtin.meta: flush_handlers

    - name: Enable and start the MediFlow web service
      ansible.builtin.systemd_service:
        name: mediflow-web.service
        enabled: true
        state: started

    - name: Verify the Nginx health response
      ansible.builtin.uri:
        url: "{{ mediflow_url }}/health"
        use_proxy: false
        return_content: true
        status_code: 200
      register: mediflow_health
      until: (mediflow_health.json | default({})).get('status') == 'healthy'
      retries: 5
      delay: 2

    - name: Verify the React entry page
      ansible.builtin.uri:
        url: "{{ mediflow_url }}/"
        use_proxy: false
        return_content: true
        status_code: 200
      register: mediflow_home
      failed_when: >
        mediflow_home.status != 200 or
        'id="root"' not in (mediflow_home.content | default(''))

  handlers:
    - name: Restart MediFlow web service
      ansible.builtin.systemd_service:
        name: mediflow-web.service
        daemon_reload: true
        state: restarted
