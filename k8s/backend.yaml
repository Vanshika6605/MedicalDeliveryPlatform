apiVersion: v1
kind: Service
metadata:
  name: db
spec:
  clusterIP: None
  selector:
    app: mediflow-db
  ports:
    - port: 5432
      name: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mediflow-db
spec:
  serviceName: db
  replicas: 1
  selector:
    matchLabels:
      app: mediflow-db
  template:
    metadata:
      labels:
        app: mediflow-db
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: medicaldelivery
            - name: POSTGRES_USER
              value: mediflow
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mediflow-credentials
                  key: postgres-password
          readinessProbe:
            exec:
              command: [pg_isready, -U, mediflow, -d, medicaldelivery, -h, 127.0.0.1]
            periodSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: api
spec:
  selector:
    app: mediflow-api
  ports:
    - port: 5000
      targetPort: http
      name: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mediflow-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mediflow-api
  template:
    metadata:
      labels:
        app: mediflow-api
    spec:
      initContainers:
        - name: wait-for-db
          image: postgres:16-alpine
          command: [sh, -ec, 'until pg_isready -h db -U mediflow -d medicaldelivery; do sleep 2; done']
      containers:
        - name: express
          image: mediflow-api:k8s-1.0
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 5000
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mediflow-credentials
                  key: postgres-password
            - name: DATABASE_URL
              value: postgres://mediflow:$(POSTGRES_PASSWORD)@db:5432/medicaldelivery
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: mediflow-credentials
                  key: jwt-secret
            - name: CLIENT_URLS
              valueFrom:
                configMapKeyRef:
                  name: mediflow-demo-origin
                  key: url
          startupProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 5
